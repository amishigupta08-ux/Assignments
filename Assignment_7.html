
<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu Using Lists</title>

    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 15px;
            background-color: #333;
            overflow: hidden;
        }

        li {
            display: inline;
        }

        li a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 20px;
        }

        li a:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
